name: Build and deploy Python project to Azure Function App - sfda-reconciliation-app

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_NAME: sfda-reconciliation-app
  AZURE_FUNCTIONAPP_PACKAGE_PATH: .
  PYTHON_VERSION: "3.12"

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies for validation
        run: pip install -r requirements.txt

      - name: Validate required Azure Functions files
        shell: bash
        run: |
          set -e

          required_files=(
            "function_app.py"
            "host.json"
            "requirements.txt"
          )

          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "Required file is missing: $file"
              exit 1
            fi
          done

          echo "Required project files are present."

      - name: Validate Python syntax
        run: |
          python -m compileall \
            function_app.py \
            engine \
            config

      - name: Verify function_app import
        run: |
          python - <<'PY'
          import function_app

          if not hasattr(function_app, "app"):
              raise RuntimeError(
                  "function_app.py was imported, but no variable named 'app' was found."
              )

          print("function_app.py imported successfully.")
          print("Azure Functions app object found.")
          PY

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_A7F67E2D1CB7477A971E7B2AD479CD0F }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_D57BA3F0BD1F4199A96E44DA5E102117 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_F7881D9CCEF9483F953C7F423CFACB41 }}

      - name: Deploy to Azure Functions
        id: deploy-to-function
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          package: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
          remote-build: true
